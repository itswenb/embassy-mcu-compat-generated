name: 生成仓库持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Rust 与目标平台
        run: |
          rustup toolchain install 1.97.0 --profile minimal \
            --target thumbv7m-none-eabi \
            --target thumbv7em-none-eabihf \
            --target thumbv8m.base-none-eabi \
            --target thumbv8m.main-none-eabihf \
            --target riscv32imac-unknown-none-elf \
            --target riscv32imafc-unknown-none-elf
          rustup default 1.97.0

      - name: 验证构建选择协议
        run: |
          rustc --test --edition=2024 build.rs -o "${RUNNER_TEMP}/build-script-tests"
          "${RUNNER_TEMP}/build-script-tests"

      - name: 编译原生 STM32 路径
        run: |
          env -u EMBASSY_MCU_COMPAT_CHIP cargo check \
            -p stm32-metapac \
            --target thumbv7m-none-eabi \
            --features pac,metadata,stm32f103c8

      - name: 编译兼容 GD 路径
        env:
          EMBASSY_MCU_COMPAT_CHIP: gd32f303cb
        run: |
          cargo check \
            -p stm32-metapac \
            --target thumbv7em-none-eabihf \
            --features pac,metadata,stm32f303cb

      - name: 拒绝从 Embassy 入口选择 RISC-V 型号
        env:
          EMBASSY_MCU_COMPAT_CHIP: gd32vf103c8
        run: |
          if cargo check \
            -p stm32-metapac \
            --target thumbv7m-none-eabi \
            --features pac,metadata,stm32f103c8 \
            2>riscv-error.log; then
            exit 1
          fi
          grep -q "是 RISC-V 型号，不能通过 embassy-stm32 使用" riscv-error.log

      - name: 编译全量 PAC 代表目标
        run: |
          cargo check \
            -p mcu-metapac \
            --target thumbv7m-none-eabi \
            --features pac,metadata,gd32f103c8
          cargo check \
            -p mcu-metapac \
            --target thumbv7em-none-eabihf \
            --features pac,metadata,gd32a103cb
          cargo check \
            -p mcu-metapac \
            --target thumbv8m.base-none-eabi \
            --features pac,metadata,gd32c211ex
          cargo check \
            -p mcu-metapac \
            --target thumbv8m.main-none-eabihf \
            --features pac,metadata,gd32a503cb
          cargo check \
            -p mcu-metapac \
            --target riscv32imac-unknown-none-elf \
            --features pac,metadata,gd32vf103c8
          cargo check \
            -p mcu-metapac \
            --target riscv32imafc-unknown-none-elf \
            --features pac,metadata,gd32vw553hi
