name: 同步生成的 metapac

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-generated-metapac
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CMSIS_TOOLBOX_VERSION: "2.14.1"
      CMSIS_TOOLBOX_SHA256: "c83735c0c1dfd95b2865e908c7adb8cd5d4fd7ec61da96990072d9e77b3e3e25"
      GIGADEVICE_ACCEPT_SLA_GD0001: "1"
      GIGADEVICE_ACCEPT_SLA_GD0003: "1"
      GIGADEVICE_ACCEPT_SLA_GD0006: "1"

    steps:
      - name: 检出生成仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装固定 Rust 工具链
        run: |
          rustup toolchain install nightly-2025-12-11 --profile minimal \
            --component rust-src --component rustfmt --component clippy \
            --target thumbv6m-none-eabi \
            --target thumbv7m-none-eabi \
            --target thumbv7em-none-eabi \
            --target thumbv7em-none-eabihf \
            --target thumbv8m.base-none-eabi \
            --target thumbv8m.main-none-eabihf \
            --target riscv32imac-unknown-none-elf \
            --target riscv32imafc-unknown-none-elf
          rustup toolchain install 1.97.0 --profile minimal \
            --target thumbv7m-none-eabi \
            --target riscv32imafc-unknown-none-elf
          rustup default nightly-2025-12-11

      - name: 安装来源处理工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools libdigest-sha-perl poppler-utils

      - name: 安装固定 CMSIS-Toolbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cmsis-toolbox"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/cmsis-toolbox.tar.gz" \
            "https://github.com/Open-CMSIS-Pack/cmsis-toolbox/releases/download/${CMSIS_TOOLBOX_VERSION}/cmsis-toolbox-linux-amd64.tar.gz"
          printf '%s  %s\n' \
            "${CMSIS_TOOLBOX_SHA256}" \
            "${RUNNER_TEMP}/cmsis-toolbox.tar.gz" \
            | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/cmsis-toolbox.tar.gz" \
            -C "${RUNNER_TEMP}/cmsis-toolbox" \
            --strip-components=1
          chmod -R +x "${RUNNER_TEMP}/cmsis-toolbox/bin"
          echo "${RUNNER_TEMP}/cmsis-toolbox/bin" >> "$GITHUB_PATH"

      - name: 检出来源与官方生成基线
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/itswenb/embassy-mcu-compat.git \
            "${RUNNER_TEMP}/embassy-mcu-compat"
          revision="$(sed -n 's/^stm32_data_generated = "\([0-9a-f]\{40\}\)"$/\1/p' "${RUNNER_TEMP}/embassy-mcu-compat/sources.lock.toml")"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
          git init "${RUNNER_TEMP}/official-generated"
          git -C "${RUNNER_TEMP}/official-generated" remote add origin \
            https://github.com/embassy-rs/stm32-data-generated.git
          git -C "${RUNNER_TEMP}/official-generated" fetch --depth 1 origin "${revision}"
          git -C "${RUNNER_TEMP}/official-generated" checkout --detach FETCH_HEAD

      - name: 恢复项目内来源缓存
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/embassy-mcu-compat/.cache/research
            ${{ runner.temp }}/embassy-mcu-compat/.cache/tools
          key: gd32-generated-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gd32-generated-v1-${{ runner.os }}-

      - name: 还原固定来源缓存
        shell: bash
        working-directory: ${{ runner.temp }}/embassy-mcu-compat
        run: |
          set -euo pipefail
          cargo run --locked --release --bin mcu-compat-gen -- sources update \
            --cache-dir "${RUNNER_TEMP}/sources-cache"
          git diff --exit-code -- sources.lock.toml
          cargo run --locked --release --bin mcu-compat-gen -- audit \
            --frozen \
            --cache-dir "${RUNNER_TEMP}/sources-cache"

      - name: 重新生成并验收
        shell: bash
        working-directory: ${{ runner.temp }}/embassy-mcu-compat
        run: |
          set -euo pipefail
          cargo run --locked --release --bin mcu-compat-gen -- generate \
            --official-generated "${RUNNER_TEMP}/official-generated" \
            --output "${RUNNER_TEMP}/patch-generated" \
            --cache-dir "${RUNNER_TEMP}/sources-cache" \
            --include-test
          rustc --test --edition=2024 \
            "${RUNNER_TEMP}/patch-generated/build.rs" \
            -o "${RUNNER_TEMP}/build-script-tests"
          "${RUNNER_TEMP}/build-script-tests"

      - name: 生成全部 GD32 原生 PAC
        shell: bash
        working-directory: ${{ runner.temp }}/embassy-mcu-compat
        run: scripts/sync-gigadevice-sources.sh

      - name: 合并兼容 patch 与全量原生 PAC
        shell: bash
        working-directory: ${{ runner.temp }}/embassy-mcu-compat
        run: |
          set -euo pipefail
          python3 scripts/publish_mcu_metapac.py \
            --patch "${RUNNER_TEMP}/patch-generated" \
            --native .cache/generated/gigadevice-metapac-complete-v1 \
            --output "${RUNNER_TEMP}/generated"

      - name: 同步生成文件
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/embassy-mcu-compat/scripts/sync-generated-repository.sh" \
            "${RUNNER_TEMP}/generated" \
            "${GITHUB_WORKSPACE}"

      - name: 编译原生与兼容路径
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/generated-target
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Cargo.lock
          env -u EMBASSY_MCU_COMPAT_CHIP cargo check \
            -p stm32-metapac \
            --target thumbv7m-none-eabi \
            --features pac,metadata,stm32f103c8
          EMBASSY_MCU_COMPAT_CHIP=gd32f103c8 cargo check \
            -p stm32-metapac \
            --target thumbv7m-none-eabi \
            --features pac,metadata,stm32f103c8
          cargo check \
            -p mcu-metapac \
            --target thumbv7m-none-eabi \
            --features pac,metadata,gd32f103c8
          cargo check \
            -p mcu-metapac \
            --target thumbv7em-none-eabihf \
            --features pac,metadata,gd32a103cb
          cargo check \
            -p mcu-metapac \
            --target thumbv8m.base-none-eabi \
            --features pac,metadata,gd32c211ex
          cargo check \
            -p mcu-metapac \
            --target thumbv8m.main-none-eabihf \
            --features pac,metadata,gd32a503cb
          cargo check \
            -p mcu-metapac \
            --target riscv32imac-unknown-none-elf \
            --features pac,metadata,gd32vf103c8
          cargo check \
            -p mcu-metapac \
            --target riscv32imafc-unknown-none-elf \
            --features pac,metadata,gd32vw553hi
          ln -s "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/embassy-mcu-compat-generated"
          env -u EMBASSY_MCU_COMPAT_CHIP cargo +1.97.0 check \
            --manifest-path "${RUNNER_TEMP}/embassy-mcu-compat/examples/stm32f103c8-native/Cargo.toml" \
            --target thumbv7m-none-eabi
          EMBASSY_MCU_COMPAT_CHIP=gd32f103c8 cargo +1.97.0 check \
            --manifest-path "${RUNNER_TEMP}/embassy-mcu-compat/examples/gd32f103c8/Cargo.toml" \
            --target thumbv7m-none-eabi
          rm -f Cargo.lock

      - name: 提交生成变化
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "生成内容没有变化。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "生成：同步 MCU 兼容 metapac"

          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          unset auth_header
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git config --local --unset-all http.https://github.com/.extraheader
          trap - EXIT
